<!DOCTYPE html>
<html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,Roboto,Arial,sans-serif;
       background:repeating-linear-gradient(180deg,#e4eee6 0 70px,#ecf3ed 70px 140px);color:#1d2733;text-align:center;padding:24px}
  .c{background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 4px 18px rgba(0,0,0,.08);max-width:360px;width:100%}
  .i{font-size:52px}
  h2{margin:10px 0 6px}
  p{color:#6b7c72;line-height:1.5}
  button{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:#1f6f4a;color:#fff}
  button.s{background:#e6f4ec;color:#1f6f4a}
</style></head>
<body><div class="c">
  <div class="i">📶</div><h2>Nėra ryšio</h2>
  <p>Nepavyko atidaryti grupės puslapio. Patikrinkite internetą ir bandykite dar kartą.</p>
  <button onclick="Turnyrai.retry()">Bandyti dar kartą</button>
  <button class="s" onclick="Turnyrai.change()">Keisti grupę</button>
</div></body></html>
