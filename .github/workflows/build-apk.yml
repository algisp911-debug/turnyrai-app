name: Build APK

# APK surenkamas tik pakeitus programėlės kodą (aplanką android/) arba paleidus rankiniu būdu.
# Rezultatas keliamas į „Releases“, ne į Actions artefaktus, kad neužimtų Actions vietos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pasirašymo raktas
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Nėra KEYSTORE_BASE64 paslapties (Settings → Secrets and variables → Actions)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Surinkti APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: turnyrai
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Paruošti failą
        run: cp android/app/build/outputs/apk/release/app-release.apk Turnyrai.apk

      - name: Išleisti versiją
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Turnyrai 1.${{ github.run_number }}
          files: Turnyrai.apk
          make_latest: true
          body: |
            Parsisiųsti: **Turnyrai.apk** (žemiau, „Assets“).
            Pastovi nuoroda į naujausią versiją:
            https://github.com/${{ github.repository }}/releases/latest/download/Turnyrai.apk
